# GitHub Pages build for the LSQuant documentation site.
#
# The site is MkDocs Material, assembled from README.md, docs/ and examples/ by
# docs-site/assemble.sh, with the Doxygen C++ API under api/. Pull requests build
# the site and check it; only pushes to main (or a manual run on main) deploy.
#
# Pitfall: the Doxygen configure step still needs the Boost/Eigen/GSL/FFTW -dev
# packages, because the top-level CMakeLists find_package()s them even though
# the docs target compiles no source.
#
# Warning: deployment needs "Settings > Pages > Source" set to "GitHub Actions".
name: docs
on:
  push:
    branches: [main]
  pull_request:
    paths: ['docs/**', 'docs-site/**', 'examples/**', 'README.md', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz libboost-dev libeigen3-dev libgsl-dev libfftw3-dev
      - name: Install MkDocs
        run: pip install -r docs-site/requirements.txt
      - name: Assemble the site source
        run: docs-site/assemble.sh
      - name: Build the site
        run: mkdocs build -f docs-site/mkdocs.yml
      - name: Build the Doxygen C++ API
        run: |
          cmake -S . -B build/doxygen -DBUILD_DOCS=ON -DLSQUANT_BUILD_INPUT_TOOLS=OFF -DLSQUANT_BUILD_PYTHON=OFF -DBUILD_TESTING=OFF
          cmake --build build/doxygen --target docs
          mkdir -p build/site/api
          cp -r build/doxygen/docs/html/. build/site/api/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
