site_name: LSQuant
site_description: Linear-scaling quantum transport for large materials models
site_url: https://josehgarciaa.github.io/lsquant/
repo_url: https://github.com/josehgarciaa/lsquant
repo_name: josehgarciaa/lsquant
edit_uri: ""
docs_dir: ../build/site_src
site_dir: ../build/site

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: {icon: material/brightness-4, name: Light mode}

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.arithmatex: {generic: true}

extra_javascript:
  - assets/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
extra_css:
  - assets/extra.css

not_in_nav: |
  /examples/**
  /docs/**

nav:
  - Home: index.md
  - Get started:
      - Overview and quickstart: quickstart.md
      - Install: docs/how-to/install.md
      - First calculation: docs/tutorials/getting-started.md
